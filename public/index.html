/* ---- js/ui.js ---- */
/* LOST STARWAYS - browser UI: screen, input, boot, overlays, mods */
(function () {
  var S = window.Starways;
  var PACKS_KEY = "starways.packs.v1";
  function $(id) { return document.getElementById(id); }
  function store() { try { return window.localStorage; } catch (e) { return null; } }

  var out = $("out"), cmd = $("cmd"), typed = $("typed");
  var gfx = new S.Gfx($("pic"));
  var morebar = document.createElement("div");
  morebar.id = "morebar";
  morebar.className = "hidden";
  morebar.innerHTML = "<button id=\"more\" aria-label=\"Show more text\">MORE</button>";
  out.appendChild(morebar);           // lives at the end of #out; show/hide only
  var mode = "boot", history = [], hpos = 0, queue = [], typing = null;
  var pageTop = null, pageUsed = 0, waitingMore = false, noPage = false;

  /* ---------- typewriter output (paged: a full screen waits for MORE) ---------- */
  // Each response pages independently: when the output is idle and a fresh
  // print arrives, that response starts its own empty page, so a short answer
  // (TAKEN., a candle lit) shows in full instead of inheriting the fullness
  // of whatever was on screen before it. MORE appears only when the response
  // itself is taller than the screen.
  function print(text, cls) {
    var fresh = !queue.length && !typing && !waitingMore;
    queue.push({ t: text, c: cls });
    if (!typing && !waitingMore) {
      if (fresh) { pageTop = null; pageUsed = 0; }
      next();
    }
  }
  function line(q) {
    var d = document.createElement("div");
    d.className = "ln " + (q.c || "");
    out.appendChild(d);
    while (out.childNodes.length > 400) out.removeChild(out.firstChild);
    return d;
  }
  function lineHeightPx() {
    var v = parseFloat(getComputedStyle(out).lineHeight);
    return isNaN(v) ? 24 : v;
  }
  // Would a line of height h make the current page taller than the screen?
  // Measured from the page's own accumulated height (pageUsed), not from the
  // scroll position: a response that starts on a half-full screen can still
  // fit in full, and one that starts at the bottom of a full screen still
  // gets the whole viewport to itself.
  function pageOverflows(h) {
    var vh = out.clientHeight;
    if (vh <= 0) return false;
    return pageUsed + h > vh - 4;
  }
  // Split a single line taller than the screen at a word boundary: [fits, rest]
  function splitTall(t, fit, probe) {
    var full = probe.offsetHeight;
    if (full <= fit || fit <= 0) return null;
    var cut = Math.max(1, Math.floor(t.length * (fit / full)));
    var sp = t.lastIndexOf(" ", cut);
    if (sp < cut * 0.5) sp = t.indexOf(" ", cut);
    if (sp < 1 || sp >= t.length - 1) return [t.slice(0, cut), t.slice(cut)];
    return [t.slice(0, sp), t.slice(sp + 1)];
  }
  // Append the next queued line if it fits on the current page. Returns
  // { d, q } for a text line, { blank } for an empty one, or null when the
  // screen is full (the line goes back to the queue and MORE is shown).
  function takeLine() {
    var q = queue.shift(), d = line(q), first = false;
    if (!pageTop) { pageTop = d; first = true; }
    function park() { out.removeChild(d); queue.unshift(q); showMore(); return null; }
    if (!q.t) {
      d.textContent = " ";
      var bh = lineHeightPx();
      if (!first && !noPage && pageOverflows(bh)) return park();
      pageUsed += bh;
      return { blank: true };
    }
    d.textContent = q.t;
    var vh = out.clientHeight;
    if (d.offsetHeight > vh && vh > 0) {
      var parts = splitTall(q.t, vh, d);
      if (parts) { q.t = parts[0]; d.textContent = parts[0]; queue.unshift({ t: parts[1], c: q.c }); }
    }
    if (!first && !noPage && pageOverflows(d.offsetHeight)) return park();
    pageUsed += d.offsetHeight;
    return { d: d, q: q };
  }
  // Scroll the page top back to the top of the view: the sticky MORE bar can
  // push the content past the viewport, and a scroll-to-bottom would hide the
  // first line of the page — the one thing paging must not do.
  function snapPage() {
    if (!pageTop) return;
    var ot = out.getBoundingClientRect().top, pt = pageTop.getBoundingClientRect().top;
    out.scrollTop += pt - ot;
  }
  function showMore() {
    waitingMore = true;
    typing = null;
    out.appendChild(morebar);           // move it to the end of the text
    morebar.classList.remove("hidden");
    snapPage();
  }
  function dropMore() {
    waitingMore = false;
    morebar.classList.add("hidden");
    pageTop = null; pageUsed = 0;
  }
  function advanceMore() {
    if (!waitingMore) return;
    dropMore();
    next();
  }
  function next() {
    if (waitingMore) return;
    // The queue draining only ends the typing: lines printed later in this
    // response still join the current page. A NEW response resets the page
    // itself (see print).
    if (!queue.length) { typing = null; return; }
    var r = takeLine();
    if (!r) return;
    if (r.blank) return next();
    typing = { d: r.d, t: r.q.t, i: 0 };
    var me = typing, d = r.d;
    (function tick() {
      if (typing !== me) return;
      me.i += DEMO_MORE ? 30 : 3;             // demo skips the animation, not the paging
      d.textContent = me.t.slice(0, me.i);
      out.scrollTop = out.scrollHeight;
      if (me.i >= me.t.length) next(); else requestAnimationFrame(tick);
    })();
  }
  function flush() {
    if (typing) { typing.d.textContent = typing.t; typing = null; }
    while (queue.length && !waitingMore) {
      var r = takeLine();
      if (!r) break;                          // screen full: the rest waits for MORE
      r.d.textContent = r.q ? r.q.t : "\u00a0";
    }
    if (waitingMore) snapPage(); else out.scrollTop = out.scrollHeight;
  }
  function clear() {
    queue = []; typing = null;
    pageTop = null; pageUsed = 0; waitingMore = false;
    morebar.classList.add("hidden");
    out.textContent = "";
    out.appendChild(morebar);           // it lives in #out
  }

  /* ---------- theme & effects ---------- */
  function theme(c) {
    c = c || { border: 14, bg: 6, text: 14 };
    var r = document.documentElement.style;
    r.setProperty("--border", S.PALETTE[c.border === undefined ? 14 : c.border]);
    r.setProperty("--bg", S.PALETTE[c.bg === undefined ? 6 : c.bg]);
    r.setProperty("--fg", S.PALETTE[c.text === undefined ? 14 : c.text]);
  }
  function flash(kind) {
    var b = document.body;
    b.classList.add("flash-" + kind);
    setTimeout(function () { b.classList.remove("flash-" + kind); }, 700);
  }
  function status(s) {
    function pad(n, l) { return ("0000" + n).slice(-l); }
    $("st-land").textContent = s.land;
    $("st-score").textContent = "SC " + pad(s.score, 4);
    $("st-parts").textContent = "PARTS " + pad(s.parts, 2) + "/" + s.total;
    $("st-moves").textContent = "MV " + pad(s.moves, 3);
  }

  /* ---------- overlays ---------- */
  function showInventory(d) {
    function fill(ul, list, empty) {
      ul.textContent = "";
      (list.length ? list : [empty]).forEach(function (t) { var li = document.createElement("li"); li.textContent = t; ul.appendChild(li); });
    }
    fill($("inv-items"), d.items, "NOTHING");
    fill($("inv-parts"), d.parts, "NONE YET");
    $("inv-count").textContent = d.parts.length + "/" + d.total;
    var slots = $("inv-slots"); slots.textContent = "";
    for (var i = 0; i < d.total; i++) { var s = document.createElement("span"); if (i < d.parts.length) s.className = "on"; slots.appendChild(s); }
    $("invpanel").classList.remove("hidden");
  }
  function closeOverlays() {
    $("invpanel").classList.add("hidden");
    $("mods").classList.add("hidden");
    cmd.focus();
  }
  function overlayOpen() { return !$("invpanel").classList.contains("hidden") || !$("mods").classList.contains("hidden"); }

  /* ---------- score reporting to the hub ---------- */
  // The game lives at /play inside the platform iframe, which appends ?token=.
  // Forward that token as a header on the POST, the same way server.js reads it.
  function recordScore(score) {
    var headers = { "content-type": "application/json" };
    try {
      var t = new URLSearchParams(location.search).get("token");
      if (t) headers["x-usernode-token"] = t;
    } catch (e) { }
    fetch("/api/scores", { method: "POST", headers: headers, body: JSON.stringify({ game: "lost-starways", score: score }) })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d) { print("SCORE NOT SAVED - HUB UNREACHABLE", "sys"); return; }
        print("SCORE RECORDED, " + String(d.username).toUpperCase() + ". HUB RANK: #" + d.rank, "good");
      })
      .catch(function () { print("SCORE NOT SAVED - HUB UNREACHABLE", "sys"); });
  }
  function goHub() { location.href = "/" + location.search; }

  /* ---------- engine ---------- */
  var engine = new S.Engine({
    out: print, clear: clear, status: status, theme: theme, flash: flash,
    sound: function (n) { S.Sound.play(n); },
    pic: function (ops, check, anim) { gfx.draw(ops, check, anim); },
    inventory: showInventory,
    crt: function () { $("screen").classList.toggle("crt"); },
    copy: function (t) { try { navigator.clipboard.writeText(t); return true; } catch (e) { return false; } },
    mods: openMods,
    recordScore: recordScore
  });

  function submit(v) {
    S.Sound.unlock();
    if (waitingMore) {
      if (!v.trim()) return advanceMore();   // a bare Enter still just pages on
      dropMore();                            // a typed command jumps ahead: the
      noPage = true; flush(); noPage = false;// queued text shows at once, then
      pageTop = null; pageUsed = 0;          // the command runs on a fresh page
    }
    flush();
    if (mode === "boot") return title();
    if (mode === "title") {
      mode = "play";
      var w = v.trim();
      var lc = w.match(/^(load|restore)\s+(\S{20,})$/i);
      if (lc) { engine.loadCode(lc[2]); if (!engine.state) engine.newGame(); return; }
      if (/^(new|new game|n)$/i.test(w) || !engine.hasSave()) return engine.newGame();
      engine.restore();                      // don't start a new game first - it would overwrite the save
      if (!engine.state) engine.newGame();
      return;
    }
    if (!v.trim()) return;
    history.push(v); hpos = history.length;
    print("> " + v.toUpperCase(), "echo");
    engine.command(v);
  }

  /* ---------- input ---------- */
  function sync() { typed.textContent = cmd.value.toUpperCase(); }
  function touchPrimary() { return window.matchMedia && window.matchMedia("(pointer: coarse)").matches; }
  function dismissKeyboard() { if (touchPrimary() && document.activeElement === cmd) cmd.blur(); }
  cmd.addEventListener("input", function () { sync(); S.Sound.play("key"); });
  document.addEventListener("keydown", function (e) {
    if (e.target && e.target.id === "modtext") { if (e.key === "Escape") closeOverlays(); return; }
    if (overlayOpen()) { if (!e.ctrlKey && !e.metaKey) { e.preventDefault(); closeOverlays(); } return; }
    if (mode === "boot") { e.preventDefault(); return title(); }
    if (waitingMore && e.key !== "Enter") {
      // Enter falls through to the normal submit path below: a typed command
      // jumps ahead and runs, an empty one just pages on (submit sorts the two).
      if (cmd.value) return;                      // mid-command: keep editing
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key.length === 1 && e.key !== " ") {
        // A first letter pages on once AND starts a command in the input.
        e.preventDefault(); advanceMore(); cmd.focus();
        cmd.value += e.key; sync(); S.Sound.play("key");
        return;
      }
      e.preventDefault(); advanceMore(); return;  // a bare keypress pages on
    }
    if (e.key === "Tab") { e.preventDefault(); return submit("i"); }
    if (document.activeElement !== cmd) cmd.focus();
    if (e.key === "Enter") { e.preventDefault(); var v = cmd.value; cmd.value = ""; sync(); submit(v); dismissKeyboard(); }
    else if (e.key === "ArrowUp" && history.length) { e.preventDefault(); hpos = Math.max(0, hpos - 1); cmd.value = history[hpos]; sync(); }
    else if (e.key === "ArrowDown" && history.length) { e.preventDefault(); hpos = Math.min(history.length, hpos + 1); cmd.value = history[hpos] || ""; sync(); }
  });
  $("screen").addEventListener("click", function (e) {
    if (mode === "boot") return title();
    if (waitingMore && !overlayOpen()) return advanceMore();
    if (e.target.closest("#mods .box")) return;
    if (overlayOpen()) return closeOverlays();
    if (!e.target.closest("button")) cmd.focus();
  });
  Array.prototype.forEach.call(document.querySelectorAll("#keys button"), function (b) {
    b.addEventListener("click", function (e) {
      e.stopPropagation();
      if (b.getAttribute("data-cmd") === "hub") return goHub();
      if (mode !== "play") return submit("");
      submit(b.getAttribute("data-cmd"));
    });
  });

  /* ---------- boot + title ---------- */
  // Deterministic demo for checks and reviewers: /play?demo=more starts a game
  // and floods the screen with narration so the MORE paging shows at once.
  var DEMO_MORE = false;
  try { DEMO_MORE = new URLSearchParams(location.search).get("demo") === "more"; } catch (e) { }
  var demoFlooded = false;
  function floodDemo() {
    print("DEMO: LONG TEXT PAGES UP WITH MORE, SO NOTHING SCROLLS AWAY UNREAD.", "good");
    engine.say(engine.text(S.packs.core.intro, "core"), "sys");
    // ?say=<command>: once MORE is showing, run it through the real input
    // path - a typed command jumps ahead and the game answers (regression
    // check for "typing while MORE submits the command").
    var demoCmd = null;
    try { demoCmd = new URLSearchParams(location.search).get("say"); } catch (e) { }
    if (demoCmd) {
      var iv = setInterval(function () {
        if (!waitingMore) return;
        clearInterval(iv);
        submit(demoCmd);
      }, 50);
    }
  }
  function boot() {
    var el = $("boot"), lines = [
      "", "    **** STARWAYS 64 BASIC V2 ****", "", " 64K RAM SYSTEM  38911 BASIC BYTES FREE", "", "READY.",
      "LOAD\"STARWAYS\",8,1", "", "SEARCHING FOR STARWAYS", "LOADING"
    ], i = 0;
    document.body.classList.remove("loading");
    (function step() {
      if (mode !== "boot") return;
      if (i < lines.length) { el.textContent += lines[i++] + "\n"; return setTimeout(step, DEMO_MORE ? 10 : (i > 6 ? 350 : 120)); }
      document.body.classList.add("loading");
      setTimeout(title, DEMO_MORE ? 0 : 1600);
    })();
  }
  function title() {
    if (mode !== "boot") return;
    mode = "title";
    document.body.classList.remove("loading");
    $("boot").classList.add("hidden");
    theme(null);
    clear();
    gfx.draw(S.packs.core.titlePic, null, true);
    print("LOST STARWAYS", "head");
    print("A text adventure across seven strange worlds.", "room");
    print("");
    if (engine.hasSave()) {
      print("PRESS RETURN TO CONTINUE YOUR SAVED GAME", "good");
      print("(or type NEW for a new game)", "sys");
    } else print("PRESS RETURN TO START A NEW GAME", "good");
    print("Got a save code from another device? Type LOAD followed by the code.", "sys");
    print("");
    print("Type HELP at any time. TAB or I shows your inventory. MODS loads community lands.", "sys");
    print("V" + S.VERSION + "  -  (C) 2026 FLUSHTHEFASHION", "sys");
    cmd.focus();
    if (DEMO_MORE && !demoFlooded) { demoFlooded = true; mode = "play"; engine.newGame(); floodDemo(); }
  }

  /* ---------- community packs ---------- */
  function savedPacks() {
    var ls = store();
    try { return JSON.parse(ls && ls.getItem(PACKS_KEY)) || {}; } catch (e) { return {}; }
  }
  function writePacks(obj) { var ls = store(); try { if (ls) ls.setItem(PACKS_KEY, JSON.stringify(obj)); } catch (e) { } }
  function loadSavedPacks() {
    var all = savedPacks();
    // main packs first so side-quest hooks resolve
    Object.keys(all).sort(function (a, b) { return (all[a].type === "side") - (all[b].type === "side"); }).forEach(function (id) {
      var p = all[id];
      if (S.packs[id] && S.packs[id]._source === "builtin") return;
      if (S.validatePack(p).ok) S.addPack(p, "community");
    });
  }
  function parsePasted() {
    var txt = $("modtext").value.trim(), msg = $("modmsg");
    if (!txt) { msg.textContent = "Paste a pack first."; return null; }
    if (txt.length > 300000) { msg.textContent = "That pack is too big (max 300KB)."; return null; }
    try { return JSON.parse(txt); }
    catch (e) { msg.textContent = "NOT VALID JSON:\n" + e.message + "\n\nTip: check for missing commas, trailing commas, or 'single' quotes."; return null; }
  }
  function report(r) {
    var t = r.ok ? "OK! This pack is valid." : "PROBLEMS FOUND:";
    r.errors.forEach(function (e) { t += "\n  ERROR  " + e; });
    r.warnings.forEach(function (w) { t += "\n  warn   " + w; });
    $("modmsg").textContent = t;
  }
  function renderModList() {
    var ul = $("modlist"), all = savedPacks(), ids = Object.keys(all);
    ul.textContent = "";
    if (!ids.length) { var li0 = document.createElement("li"); li0.textContent = "NONE YET"; ul.appendChild(li0); return; }
    ids.forEach(function (id) {
      var p = all[id], li = document.createElement("li"), span = document.createElement("span");
      span.textContent = p.title + " (" + (p.type === "side" ? "SIDE QUEST" : "LAND " + p.order) + ")";
      var play = document.createElement("button"); play.textContent = "PLAY";
      play.onclick = function () {
        closeOverlays();
        if (!S.packs[id]) return;
        if (mode !== "play") { mode = "play"; engine.newGame(); }
        engine.play(id);
      };
      var rm = document.createElement("button"); rm.textContent = "REMOVE";
      rm.onclick = function () { var a = savedPacks(); delete a[id]; writePacks(a); if (S.packs[id] && S.packs[id]._source === "community") delete S.packs[id]; renderModList(); };
      li.appendChild(span); li.appendChild(play); li.appendChild(rm); ul.appendChild(li);
    });
  }
  function openMods() { $("modmsg").textContent = ""; renderModList(); $("mods").classList.remove("hidden"); $("modtext").focus(); }
  $("mod-validate").onclick = function () { var p = parsePasted(); if (p) report(S.validatePack(p)); };
  $("mod-install").onclick = function () {
    var p = parsePasted(); if (!p) return;
    var r = S.validatePack(p); report(r);
    if (!r.ok) return;
    if (S.packs[p.id] && S.packs[p.id]._source === "builtin") { $("modmsg").textContent = "The id \"" + p.id + "\" is used by a built-in land. Pick another id."; return; }
    S.addPack(p, "community");
    var all = savedPacks(); all[p.id] = p; writePacks(all);
    $("modmsg").textContent += "\n\nINSTALLED! " + (p.type === "side" ? "Look for the rift in " + p.hook.pack + " (" + p.hook.room + "), or press PLAY to test it now." : "It joins the Starways as land " + p.order + ". Press PLAY to test it now.");
    $("modtext").value = "";
    renderModList();
  };
  $("mod-close").onclick = closeOverlays;

  loadSavedPacks();
  boot();
})();

</script>
</body>
</html>
