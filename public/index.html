<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lost Starways</title>
  <meta name="description" content="An old-school C64-style text adventure across strange lands and alien worlds.">
  <link rel="stylesheet" href="fonts.css">
  <style>
/* LOST STARWAYS - C64 look */
:root {
  --border: #6c5eb5;   /* light blue */
  --bg: #352879;       /* blue */
  --fg: #6c5eb5;       /* light blue */
  --white: #ffffff;
  --yellow: #b8c76f;
  --cyan: #70a4b2;
  --green: #9ad284;
  --red: #68372b;
  --grey: #959595;
  --key: #433900;
  /* softer, easier-on-the-eye versions (follow each land's colours) */
  --text: color-mix(in srgb, var(--fg) 30%, #f1eee4);
  --soft-yellow: color-mix(in srgb, var(--yellow) 55%, #f1eee4);
  --soft-cyan: color-mix(in srgb, var(--cyan) 55%, #f1eee4);
  --soft-green: color-mix(in srgb, var(--green) 60%, #f1eee4);
  --soft-grey: color-mix(in srgb, var(--fg) 35%, #b9b6b0);
  --bar: color-mix(in srgb, var(--fg) 55%, var(--bg));
  --pixel: "Press Start 2P", "Courier New", monospace;
  --read: "VT323", "Courier New", monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  padding: 16px;
  background: color-mix(in srgb, var(--border) 70%, #0d0b1e);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--read);
  color: var(--text);
  transition: background .15s;
}
body.loading { animation: stripes .09s steps(1) infinite; }
@keyframes stripes {
  0%   { background: repeating-linear-gradient(0deg, #68372b 0 7px, #70a4b2 7px 13px, #b8c76f 13px 18px, #352879 18px 26px, #9a6759 26px 31px); }
  50%  { background: repeating-linear-gradient(0deg, #6f3d86 0 5px, #588d43 5px 12px, #6c5eb5 12px 19px, #6f4f25 19px 24px, #ffffff 24px 26px); }
}
body.flash-die { background: #68372b !important; }
body.flash-part { animation: rainbow .12s steps(1) 5; }
@keyframes rainbow { 0% { background: #b8c76f; } 33% { background: #9ad284; } 66% { background: #70a4b2; } }

#screen {
  position: relative;
  width: min(100%, 760px);
  height: min(100%, 920px);
  background: var(--bg);
  padding: 14px;
  display: flex; flex-direction: column;
  font-size: clamp(18px, 2.5vw, 23px);
  line-height: 1.3;
  box-shadow: 0 0 0 1px rgba(255,255,255,.04), 0 8px 40px rgba(0,0,0,.35);
  overflow: hidden;
}
#screen.crt::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.07) 0 1px, transparent 1px 3px);
}

#status {
  display: flex; justify-content: space-between; gap: 1em; flex-wrap: wrap;
  background: var(--bar); color: var(--text);
  font-family: var(--pixel); font-size: clamp(8px, 1.3vw, 11px); line-height: 1.6;
  padding: 5px 8px; margin-bottom: 10px; text-transform: uppercase;
}
#pic {
  display: block; width: 100%; aspect-ratio: 16 / 5; flex: none;
  image-rendering: pixelated; image-rendering: crisp-edges;
  background: #000;
}
#out {
  flex: 1; min-height: 6em; overflow-y: auto; margin-top: 10px;
  word-wrap: break-word; padding-right: 4px;
  scrollbar-width: thin; scrollbar-color: var(--fg) var(--bg);
}
.ln { white-space: pre-wrap; color: var(--text); margin-bottom: 2px; }
.ln.head { color: var(--text); background: var(--bar); display: inline-block; padding: 3px 8px 2px; margin-top: 8px;
  font-family: var(--pixel); font-size: .5em; line-height: 1.6; letter-spacing: .02em; }
.ln.items { color: var(--soft-yellow); }
.ln.exits { color: var(--soft-cyan); }
.ln.good { color: var(--soft-green); }
.ln.warn { color: var(--soft-yellow); }
.ln.sys { color: var(--soft-grey); }
.ln.echo { color: #fbf8ef; margin-top: 10px; opacity: .9; }
.ln.die { color: #f6ded6; background: color-mix(in srgb, var(--red) 75%, var(--bg)); padding: 1px 6px; }
.ln.part { color: var(--bg); background: var(--soft-yellow); padding: 1px 6px; animation: glow 1.2s ease-in-out 2; }
@keyframes glow { 50% { background: #f1eee4; } }

#cmdline {
  position: relative; display: flex; align-items: center; min-height: 2em;
  color: #fbf8ef; cursor: text; margin-top: 4px;
}
.prompt { margin-right: .5em; color: var(--soft-cyan); }
#typed { white-space: pre; overflow: hidden; }
#cursor { color: var(--soft-cyan); animation: cur 1s steps(1) infinite; }
@keyframes cur { 50% { opacity: 0; } }
#cmd {
  position: absolute; inset: 0; width: 100%; opacity: 0;
  font: inherit; border: 0; background: transparent; color: transparent;
}

#keys { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
/* MORE prompt: sticky at the end of the text inside #out, so it adds no height
   to the screen's flex column and never pushes the picture or keys off screen. */
#morebar {
  position: sticky; bottom: 0; display: flex; justify-content: flex-end; padding-top: 6px;
}
#morebar.hidden { display: none; }
#keys button, .box button, #morebar button {
  font-family: var(--pixel); font-size: clamp(9px, 1.3vw, 11px); cursor: pointer;
  background: color-mix(in srgb, var(--key) 70%, var(--bg)); color: #e6e2d6; border: 0;
  border-bottom: 3px solid #1a1500; border-right: 3px solid #1a1500;
  padding: 8px 10px; min-width: 3em;
}
#keys button:active, .box button:active, #morebar button:active { transform: translate(1px, 1px); border-width: 0 2px 2px 0; }
#keys button:focus-visible, .box button:focus-visible, #morebar button:focus-visible { outline: 2px solid var(--white); }
#morebar button { animation: blinkmore 1s steps(1) infinite; }
@keyframes blinkmore { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { #morebar button { animation: none; } }

.overlay {
  position: absolute; inset: 0; z-index: 5;
  background: var(--bg); color: var(--text);
  display: flex; align-items: center; justify-content: center; padding: 14px;
}
.overlay.hidden { display: none; }
#boot { font-family: var(--pixel); font-size: clamp(8px, 1.5vw, 12px); line-height: 1.8; color: var(--fg); align-items: flex-start; justify-content: flex-start; white-space: pre-wrap; flex-direction: column; }
.box {
  width: min(100%, 520px); max-height: 100%; overflow-y: auto;
  border: 3px solid var(--bar); padding: 16px;
}
.box.wide { width: min(100%, 700px); }
.box-title { background: var(--bar); color: var(--text); padding: 4px 8px; margin-bottom: 10px; font-family: var(--pixel); font-size: .5em; line-height: 1.6; }
.box-title.small { margin-top: 12px; }
.box ul { list-style: none; padding: 0; margin: 0 0 8px; }
.box li { color: var(--text); }
.box li::before { content: "* "; color: var(--soft-cyan); }
.dim { color: var(--soft-grey); margin-top: 10px; }
.dim a { color: var(--soft-cyan); }
#inv-slots { display: grid; grid-template-columns: repeat(7, minmax(0, 34px)); gap: 4px; margin-bottom: 8px; }
#inv-slots span { aspect-ratio: 1; border: 2px solid var(--bar); }
#inv-slots span.on { background: var(--soft-yellow); border-color: var(--soft-yellow); box-shadow: inset 0 0 0 3px var(--bg); }
#modtext {
  width: 100%; height: 14em; resize: vertical; margin-top: 8px;
  font-family: "Courier New", monospace; font-size: 12px;
  background: #000; color: var(--green); border: 2px solid var(--fg); padding: 6px;
}
.row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
#modmsg { white-space: pre-wrap; font-family: "Courier New", monospace; font-size: 12px; color: var(--yellow); max-height: 10em; overflow-y: auto; text-transform: none; }
#modlist li { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
#modlist button { font-size: .75em; padding: 3px 6px; }

@media (max-width: 520px) {
  body { padding: 8px 16px; }
  #screen { padding: 8px; font-size: 18px; }
  #keys button { padding: 8px 6px; }
}

</style>
</head>
<body class="loading">
  <main id="screen" class="crt">
    <div id="status" aria-live="off">
      <span id="st-land">STARWAYS 64</span>
      <span id="st-score">SC 0000</span>
      <span id="st-parts">PARTS 00/21</span>
      <span id="st-moves">MV 000</span>
    </div>

    <canvas id="pic" aria-label="Picture of the current location"></canvas>

    <label id="cmdline" for="cmd">
      <span class="prompt">&gt;</span><span id="typed"></span><span id="cursor">&#9608;</span>
      <input id="cmd" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="Type a command">
    </label>

    <div id="out" role="log" aria-live="polite"></div>

    <nav id="keys" aria-label="Quick commands">
      <button data-cmd="forward">F</button><button data-cmd="back">B</button>
      <button data-cmd="left">L</button><button data-cmd="right">R</button>
      <button data-cmd="up">U</button><button data-cmd="down">D</button>
      <button data-cmd="look" class="wide">LOOK</button>
      <button data-cmd="i">I</button>
      <button data-cmd="hint" class="wide">HINT</button>
      <button data-cmd="mods" class="wide">MODS</button>
      <button data-cmd="help">?</button>
      <button data-cmd="sound" class="wide">SND</button>
      <button data-cmd="hub" class="wide">Lobby</button>
    </nav>

    <!-- Boot screen -->
    <div id="boot" class="overlay"></div>

    <!-- Inventory -->
    <div id="invpanel" class="overlay hidden" role="dialog" aria-label="Inventory">
      <div class="box">
        <div class="box-title">INVENTORY</div>
        <ul id="inv-items"></ul>
        <div class="box-title small">SHIP PARTS <span id="inv-count"></span></div>
        <div id="inv-slots"></div>
        <ul id="inv-parts"></ul>
        <div class="dim">PRESS ANY KEY</div>
      </div>
    </div>

    <!-- Community map packs -->
    <div id="mods" class="overlay hidden" role="dialog" aria-label="Community lands">
      <div class="box wide">
        <div class="box-title">COMMUNITY LANDS</div>
        <p class="dim">Paste a map pack (JSON) below. Packs are data only - they can't run code.
          See <a href="https://github.com/zkokio/lost-starways/blob/main/docs/PACK_GUIDE.md" target="_blank" rel="noopener">docs/PACK_GUIDE.md</a>.</p>
        <textarea id="modtext" spellcheck="false" placeholder='{ "format": 1, "id": "my-land", ... }'></textarea>
        <div class="row">
          <button id="mod-validate">VALIDATE</button>
          <button id="mod-install">INSTALL</button>
          <button id="mod-close">CLOSE</button>
        </div>
        <pre id="modmsg"></pre>
        <div class="box-title small">INSTALLED</div>
        <ul id="modlist"></ul>
      </div>
    </div>
  </main>

  <script>

  <script>
/* ---- js/parser.js ---- */
/* LOST STARWAYS - two-word (VERB NOUN [PREP NOUN]) parser */
(function (G) {
  var S = G.Starways;

  // Build lookup tables: phrase -> canonical
  var verbPhrases = [];   // [{words:[...], verb}]
  Object.keys(S.VERBS).forEach(function (v) {
    S.VERBS[v].forEach(function (p) { verbPhrases.push({ words: p.split(" "), verb: v }); });
  });
  verbPhrases.sort(function (a, b) { return b.words.length - a.words.length; });

  var dirWord = {};
  Object.keys(S.DIRS).forEach(function (d) { S.DIRS[d].forEach(function (w) { dirWord[w] = d; }); });

  var sysWord = {};
  Object.keys(S.SYSTEM).forEach(function (c) { S.SYSTEM[c].forEach(function (w) { sysWord[w] = c; }); });

  // ---- typo tolerance ----
  // Damerau-Levenshtein distance (a swapped pair of letters counts as one mistake)
  function dist(a, b) {
    var d = [], i, j;
    for (i = 0; i <= a.length; i++) { d[i] = [i]; }
    for (j = 0; j <= b.length; j++) d[0][j] = j;
    for (i = 1; i <= a.length; i++) for (j = 1; j <= b.length; j++) {
      var c = a[i - 1] === b[j - 1] ? 0 : 1;
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + c);
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
    }
    return d[a.length][b.length];
  }
  function allowed(w) { return w.length <= 3 ? 0 : w.length <= 5 ? 1 : 2; }
  // Best candidate within the allowed number of mistakes, or null
  S.fuzzy = function (word, candidates) {
    var max = allowed(word), best = null, bd = 99;
    if (!max || /^\d+$/.test(word)) return null;
    candidates.forEach(function (c) {
      if (c.indexOf(" ") >= 0 || c.length < 3 || Math.abs(c.length - word.length) > max) return;
      var n = dist(word, c);
      if (n <= max && n < bd) { bd = n; best = c; }
    });
    return best;
  };
  var verbWords = verbPhrases.map(function (v) { return v.words[0]; });
  var fixWords = verbWords.concat(Object.keys(dirWord), Object.keys(sysWord));
  // Common slips that the distance rule misses (too short, or too far off)
  S.MISSPELLINGS = { lok: "look", loook: "look", exmine: "examine", examin: "examine", tke: "take", tak: "take",
    invetory: "inventory", inventry: "inventory", lit: "light", foward: "forward", fowards: "forward", got: "goto", gto: "goto",
    bak: "back", lft: "left", rite: "right", rigt: "right", dwn: "down", opn: "open", clim: "climb", thow: "throw",
    scredriver: "screwdriver", screwdiver: "screwdriver", screwdrvier: "screwdriver", transalator: "translator",
    translater: "translator", tranlator: "translator", keypd: "keypad", telescop: "telescope" };

  S.dirOf = function (word) {
    if (!word) return null;
    var w = String(word).trim().split(" ");
    return dirWord[w[0]] && w.length === 1 ? dirWord[w[0]] : null;
  };

  function tokenize(text) {
    return String(text || "").toLowerCase().replace(/[^a-z0-9 ]+/g, " ").split(/\s+/).filter(Boolean);
  }

  S.parse = function (text) {
    var raw = String(text || "").toLowerCase().replace(/[^a-z0-9 ?]+/g, " ").replace(/\s+/g, " ").trim();
    if (!raw) return null;
    if (sysWord[raw]) return { system: sysWord[raw], raw: raw };

    var t = tokenize(text), fixed = [];
    if (!t.length) return null;
    // Known slips anywhere in the line
    t = t.map(function (w) { var m = S.MISSPELLINGS[w]; if (m && m !== w) { fixed.push(m); return m; } return w; });
    // First word: if it isn't a verb, direction or system word, try to correct it
    if (!dirWord[t[0]] && !sysWord[t[0]] && verbWords.indexOf(t[0]) < 0 && !/^\d+$/.test(t[0])) {
      var f = S.fuzzy(t[0], fixWords);
      if (f) { fixed.push(f); t[0] = f; }
    }
    var p = parse2(t, raw);
    if (p && fixed.length) p.fixed = fixed;
    return p;
  };

  function parse2(t, raw) {
    if (t.length === 1 && sysWord[t[0]]) return { system: sysWord[t[0]], raw: t[0] };

    // A bare number is a code: "7304" == "type 7304"
    if (t.length <= 4 && t.every(function (x) { return /^\d+$/.test(x); })) {
      return { verb: "type", n1: t.join(""), n2: "", raw: raw };
    }
    // A bare direction: "f", "forward", "go north"...

    list = arr(list);
    for (var i = 0; i < list.length; i++) {
      var fx = list[i], k;
      for (var key in fx) {
        var v = fx[key];
        switch (key) {
          case "say": this.say(this.text(v, pid)); break;
          case "set":
            if (typeof v === "object") Object.keys(v).forEach(function (f) { st.flags[self.fkey(f, pid)] = v[f]; });
            else st.flags[this.fkey(v, pid)] = true;
            break;
          case "clear": arr(v).forEach(function (f) { delete st.flags[self.fkey(f, pid)]; }); break;
          case "inc":
            if (typeof v === "object") Object.keys(v).forEach(function (f) { k = self.fkey(f, pid); st.flags[k] = (+st.flags[k] || 0) + v[f]; });
            else { k = this.fkey(v, pid); st.flags[k] = (+st.flags[k] || 0) + 1; }
            break;
          case "give": arr(v).forEach(function (id) { self.gain(self.ikey(id, pid)); }); break;
          case "remove": arr(v).forEach(function (id) { delete st.where[self.ikey(id, pid)]; }); break;
          case "place":
            k = this.ikey(v[0], pid);
            st.where[k] = v[1] ? this.rkey(v[1], pid) : st.room;
            break;
          case "show": arr(v).forEach(function (id) { delete st.hidden[self.ikey(id, pid)]; }); break;
          case "hide": arr(v).forEach(function (id) { st.hidden[self.ikey(id, pid)] = 1; }); break;
          case "exit": st.exits[this.rkey(v[0], pid) + ">" + v[1]] = v[2] ? this.rkey(v[2], pid) : ""; break;
          case "score":
            st.score = Math.max(0, st.score + (+v || 0));
            if (v > 0) this.say("(+" + v + " POINTS)", "good");
            break;
          case "sound": this.sound(v); break;
          case "secret":
            k = pid + ":" + v;
            st.secrets = st.secrets || [];
            if (st.secrets.indexOf(k) < 0) {
              st.secrets.push(k);
              st.score += 15;
              this.sound("part");
              this.say("*** SECRET FOUND! (" + st.secrets.length + " so far) +15 ***", "part");
            }
            break;
          case "goto": this.goRoom(this.rkey(v, pid)); return;
          case "die": this.die(this.text(v, pid)); return;
          case "next": this.nextPack(); return;
          case "return": this.returnFromSide(); return;
          case "win":
            this.say(this.text(v, pid), "good");
            this.state.ended = true; this.sound("win");
            this.say("FINAL SCORE: " + st.score + "   RANK: " + this.rank(), "head");
            this.say("Press HUB to see the leaderboard.", "sys");
            if (this.io.recordScore) this.io.recordScore(st.score);
            return;
          case "command":
            if (this.depth < 3) { this.depth++; this.act(S.parse(v)); this.depth--; }

      }
    }
    if (this.io.pic) this.drawPic(false); // scene may have changed (fire out, hound gone...)
  };

  /* ---------- death, beacons, saving ---------- */
  E.die = function (text) {
    var st = this.state;
    this.say(text, "die");
    this.say("*** YOU HAVE DIED ***", "die");
    this.sound("die");
    if (this.io.flash) this.io.flash("die");
    var deaths = st.deaths + 1, moves = st.moves, hints = st.hints;
    if (this.snapshot) {
      var score = Math.max(0, this.snapshot.score - 20);
      this.state = clone(this.snapshot);
      this.state.deaths = deaths; this.state.moves = moves; this.state.hints = hints; this.state.score = score;
      this.say("A beacon's light pulls you back through time... (-20 POINTS)", "good");
      var p = this.pack();
      if (this.io.theme) this.io.theme(p && p.colors || null);
      this.describe(true);
    } else {
      this.newGame();
    }
  };

  E.beaconSave = function (auto) {
    this.snapshot = clone(this.state);
    var ls = store();
    try { if (ls) ls.setItem(SAVE_KEY, JSON.stringify({ v: 1, packs: Object.keys(this.state.init), state: this.snapshot })); } catch (e) { }
    this.sound("beacon");
    this.say(auto ? "The beacon pulses. PROGRESS SAVED." : "PROGRESS SAVED AT THIS BEACON.", "good");
  };

  E.hasSave = function () {
    var ls = store();
    try { return !!(ls && ls.getItem(SAVE_KEY)); } catch (e) { return false; }
  };

  E.restore = function () {
    var ls = store(), data = null;
    try { data = ls && JSON.parse(ls.getItem(SAVE_KEY)); } catch (e) { data = null; }
    var snap = data && data.state ? data.state : this.snapshot;
    if (!snap) return this.say("NO SAVED GAME FOUND.", "warn");
    var missing = Object.keys(snap.init || {}).filter(function (pid) { return !S.packs[pid]; });
    if (missing.length) return this.say("THAT SAVE NEEDS THESE LANDS INSTALLED: " + missing.join(", ").toUpperCase(), "warn");
    this.state = clone(snap);
    this.snapshot = clone(snap);
    if (this.io.clear) this.io.clear();
    this.say("SAVED GAME RESTORED.", "good");
    var p = this.pack();
    if (this.io.theme) this.io.theme(p && p.colors || null);
    this.describe(true);
    this.status();
  };

  // Save codes: move a game between devices (base64 of the last beacon save)
  E.saveCode = function () {
    var snap = this.snapshot;
    if (!snap) return null;
    var json = JSON.stringify({ v: 1, s: snap });
    var b64 = typeof btoa !== "undefined" ? btoa(unescape(encodeURIComponent(json))) : Buffer.from(json, "utf8").toString("base64");
    return "LS1-" + b64.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  };
  E.loadCode = function (code) {
    var data = null;
    try {
      var b64 = String(code).trim().replace(/^LS1-/i, "").replace(/-/g, "+").replace(/_/g, "/");
      var json = typeof atob !== "undefined" ? decodeURIComponent(escape(atob(b64))) : Buffer.from(b64, "base64").toString("utf8");
      data = JSON.parse(json);
    } catch (e) { data = null; }
    if (!data || !data.s || !data.s.room) return this.say("THAT SAVE CODE DOESN'T WORK. Check you copied all of it.", "warn");
    var missing = Object.keys(data.s.init || {}).filter(function (pid) { return !S.packs[pid]; });
    if (missing.length) return this.say("THAT SAVE NEEDS THESE LANDS INSTALLED: " + missing.join(", ").toUpperCase(), "warn");
    this.snapshot = clone(data.s);
    var ls = store();
    try { if (ls) ls.setItem(SAVE_KEY, JSON.stringify({ v: 1, packs: Object.keys(data.s.init), state: data.s })); } catch (e) { }
    this.restore();
  };

  E.rank = function () {
    var s = this.state.score, r = S.RANKS[0][1];
    S.RANKS.forEach(function (x) { if (s >= x[0]) r = x[1]; });
    return r;
  };

  /* ---------- command handling ---------- */
  E.command = function (text) {
    if (!this.state) return;
    var lc = String(text).trim().match(/^(load|restore)\s+(\S{20,})$/i);
    if (lc) return this.loadCode(lc[2]);
    var p = S.parse(text);
    if (!p) return this.say("EH?");
    if (p.system !== "restart") this.confirmRestart = false;
    if (p.fixed) this.say("(" + p.fixed.map(up).join(", ") + ")", "sys");
    if (p.system) { this.system(p.system, p); return this.status(); }
    if (this.state.ended) { this.say("Your adventure is over for now. Type RESTART to play again.", "sys"); return; }
    if (p.unknown) { this.say("I DON'T KNOW HOW TO \"" + up(p.unknown) + "\"."); return; }
    this.state.moves++;
    this.act(p);
    this.status();
  };

  E.act = function (p) {
    if (!p || !p.verb) return;
    var st = this.state, pid = st.pack;
    p.o1 = this.resolve(p.n1);
    p.o2 = this.resolve(p.n2);
    // "give hermit ration" -> give ration to hermit
    if (p.verb === "give" && !p.n2 && p.n1 && p.n1.indexOf(" ") > 0) {
      var w = p.n1.split(" "), a = this.resolve(w[0]), b = this.resolve(w.slice(1).join(" "));
      var da = a && this.idef(a);
      if (a && b && a !== b && da && da.npc) { p.o1 = b; p.o2 = a; p.n2 = w[0]; p.n1 = w.slice(1).join(" "); }
    }
    if (p.o1) st.last = p.o1;

    // Aliens are gibberish until the audio translator is switched on
    var target = p.verb === "talk" ? p.o1 : null;
    if (target && this.idef(target) && this.idef(target).alien && !st.flags["core:translator_on"]) {
      var syl = ["zor", "blee", "ka", "nix", "vrr", "ool", "thak", "mi", "gluu", "ek", "qua", "zz"], g = [];
      for (var gi = 0; gi < 6; gi++) g.push(syl[(st.moves * 7 + gi * 5) % syl.length]);
      this.say("\"" + g.slice(0, 3).join("-") + "! " + g.slice(3).join(" ") + "?\"");
      return this.say(st.where["core:translator"] === "inv" ? "(You can't understand a word. Your audio translator is switched off.)" : "(You can't understand a word. If only you had a translator...)", "sys");
    }

    if (this.runActions(this.pack().actions, pid, pid, p)) return;
    if (S.packs.core && this.runActions(S.packs.core.actions, "core", "core", p)) return;

    var dir = S.dirOf(p.n1);
    if (p.verb === "go") return dir ? this.move(dir) : p.n1 ? this.travel(p.n1) : this.say("GO WHERE? (FORWARD, BACK, LEFT, RIGHT, UP, DOWN, or GO TO a place)");
    if (dir && ["climb", "run", "jump", "enter"].indexOf(p.verb) >= 0) return this.act({ verb: "go", n1: dir, n2: "", raw: p.raw });
    this.builtin(p);
  };

  E.builtin = function (p) {
    var st = this.state, self = this, o = p.o1, d = o && this.idef(o), r = this.rdef(), see = this.canSee();
    var needsObj = ["deactivate", "examine", "take", "drop", "open", "close", "unlock", "cut", "throw", "eat", "drink", "give",
      "read", "push", "pull", "wear", "fill", "tie", "put", "peer", "pour", "fix", "light", "extinguish", "use"];
    if (p.n1 && !o && p.n1 !== "all" && needsObj.indexOf(p.verb) >= 0) {
      return this.say(see ? "You can't see any " + up(p.n1) + " here." : "It's too dark to see.");
    }
    if (!p.n1 && needsObj.indexOf(p.verb) >= 0 && p.verb !== "examine") return this.say(up(p.verb) + " WHAT?");
    var has = o && st.where[o] === "inv";
    var name = o ? this.iname(o) : "";

    switch (p.verb) {
      case "look": return this.describe(false);
      case "examine":
        if (!o) return this.describe(false);
        return this.say(this.text(d.desc, o.split(":")[0]) || "You see nothing special about the " + name + ".");
      case "take":
        if (p.n1 === "all") {
          var got = this.itemsHere().filter(function (k) { var x = self.idef(k); return x && !x.fixed && !x.npc && !x.scenery; });
          if (!got.length) return this.say("There's nothing here to take.");
          got.forEach(function (k) { self.say(up(self.iname(k)) + ": TAKEN."); self.gain(k); });
          return;
        }
        if (has) return this.say("You already have it.");
        if (d.npc) return this.say("The " + name + " wouldn't like that.");
        if (d.fixed || d.scenery) return this.say(typeof d.fixed === "string" ? this.text(d.fixed) : "You can't take that.");
        this.say("TAKEN.");
        this.gain(o);
        return this.drawPic(false);
      case "drop":
        if (!has) return this.say("You don't have it.");
        if (d.part) return this.say("Drop a ship part? Not a chance - you need every one of them!");
        st.where[o] = st.room;
        this.say("DROPPED.");
        return this.drawPic(false);
      case "throw":
        if (!has) return this.say("You don't have it.");
        if (d.part) return this.say("Throw a ship part? Are you mad?");
        st.where[o] = st.room;
        this.say("You throw the " + name + ". It lands nearby.");
        return this.drawPic(false);
      case "read": return this.say(d.read ? this.text(d.read, o.split(":")[0]) : "There's nothing written on it.");
      case "eat":
        if (!d.edible) return this.say("You can't eat that!");
        delete st.where[o];
        return this.say(this.text(d.eat) || "Delicious!");
      case "drink":
        if (!d.drinkable) return this.say("You can't drink that!");
        delete st.where[o];
        return this.say(this.text(d.drink) || "Refreshing!");
      case "wear":
        if (!d.wearable) return this.say("You can't wear that.");
        return this.say("You put on the " + name + ". Very fetching.");
      case "give":
        if (!has) return this.say("You don't have it.");
        if (!p.o2) return this.say("Give it to whom?");
        var to = this.idef(p.o2);
        if (!to || !to.npc) return this.say("That can't accept gifts.");
        return this.say(this.text(to.refuse) || "The " + this.iname(p.o2) + " doesn't want it.");
      case "talk":
        if (o && d.npc) return this.say(this.text(d.talk, o.split(":")[0]) || "The " + name + " ignores you.");
        return this.say(o ? "It doesn't answer. Unsurprisingly." : "Talking to yourself again?");
      case "listen": return this.say(this.text(r && r.listen) || "You hear the wind moaning.");
      case "smell": return this.say(this.text(r && r.smell) || "Nothing unusual. Well, nothing TOO unusual.");
      case "wait": return this.say("Time passes...");
      case "jump": return this.say("WHEEE!");
      case "shout": return this.say("Your voice echoes... nobody answers.");
      case "hide": return this.say("There's nowhere to hide here.");
      case "dig": return this.say(this.inv().some(function (k) { return /spade|shovel/.test(k); }) ? "You dig a hole. Nothing there. You fill it in again." : "You have nothing to dig with.");
      case "type": return this.say("There's nothing here to type on.");
      case "scan":
        var scanner = this.inv().filter(function (k) { var x = self.idef(k); return x && x.scanner; })[0];
        if (!scanner) return this.say("You have nothing to scan with.");
        this.sound("beep");
        if (o && o !== scanner) return this.say("SCAN: " + (this.text(d.scan, o.split(":")[0]) || "Nothing unusual about the " + name + "."), "exits");
        return this.say("SCAN: " + (this.text(r && r.scan) || "Nothing unusual detected."), "exits");
      case "heal":
        if (st.where["core:medpen"] !== "inv") return this.say("You have nothing to heal with.");
        return this.say(o && d.npc ? "The " + name + " doesn't need healing." : "You're not hurt. Save the medical pen for someone who is.");
      case "run": return this.say("You run around in circles. Feel better?");
      case "climb": return this.say("There's nothing here to climb.");
      case "enter": return this.say("You can't enter that.");
      case "knock": return this.say("Knock knock. Nobody's there.");
      case "dance": return this.say("You do a little dance. Nobody is watching. Probably.");
      case "magic": return this.say("Nothing happens.");
      case "fix": return this.say("You'll need the whole ship first!");
      case "open": case "close": case "unlock": return this.say("It doesn't seem to open.");
      case "light": return this.say("You can't light that.");
      case "deactivate": return this.say(o ? "It doesn't have an off switch." : "SWITCH OFF WHAT?");
      case "extinguish": return this.say("It isn't burning.");
    }
    var msgs = ["Nothing happens.", "You can't do that.", "That doesn't seem to work."];
    this.say(msgs[st.moves % 3]);
  };

  E.system = function (cmd, p) {
    var st = this.state, self = this;
    switch (cmd) {
      case "inventory":
        var items = this.inv();
        if (this.io.inventory) this.io.inventory({
          items: items.filter(function (k) { var d = self.idef(k); return d && !d.part; }).map(function (k) { return self.iname(k); }),
          parts: st.parts.map(function (k) { return self.iname(k); }), total: S.PARTS_TOTAL
        });
        this.say(items.length ? "YOU ARE CARRYING: " + items.map(function (k) { return up(self.iname(k)); }).join(", ") : "YOU ARE CARRYING NOTHING.", "items");
        this.say("SHIP PARTS: " + st.parts.length + "/" + S.PARTS_TOTAL, "part");
        return;
      case "score":
        return this.say("SCORE: " + st.score + "  RANK: " + this.rank() + "  PARTS: " + st.parts.length + "/" + S.PARTS_TOTAL +
          "  SECRETS: " + (st.secrets || []).length + "  MOVES: " + st.moves + "  DEATHS: " + st.deaths, "good");
      case "hint":
        var r = this.rdef(), h = r && this.text(r.hint);
        if (!h) return this.say("No hints here. Try EXAMINE-ing everything!", "sys");
        var hk = st.room + "|" + h;
        if (!st.hints[hk]) { st.hints[hk] = 1; st.score = Math.max(0, st.score - 5); this.say("HINT (-5 POINTS):", "warn"); }
        return this.say(h, "sys");
      case "help":
        if (this.io.help) this.io.help();
        return this.say([
          "MOVE: FORWARD BACK LEFT RIGHT UP DOWN (F B L R U D)",
          "TRY: LOOK, EXAMINE X, TAKE X, DROP X, USE X, OPEN, LIGHT, EXTINGUISH, CUT, THROW, DIG, EAT, DRINK, GIVE X TO Y, TYPE 1234, READ, PUSH, PULL, CLIMB, RUN, TALK TO, TIE, FILL, PUT X IN Y, LOOK THROUGH X...",
          "I = INVENTORY   HINT = CLUE (-5)   SCORE   SAVE (AT BEACONS)   RESTORE   CODE (SAVE CODE FOR ANOTHER DEVICE)   GO TO <PLACE>   SOUND   CRT   MODS"
        ].join("\n"), "sys");
      case "save":
        if (this.rdef() && this.rdef().beacon) return this.beaconSave(false);
        return this.say("You can only save at a BEACON. Beacons also save automatically when you arrive.", "warn");
      case "restore": return this.restore();
      case "code":
        var code = this.saveCode();
        if (!code) return this.say("Reach a BEACON first - that's where your game is saved.", "warn");
        this.say("YOUR SAVE CODE (from your last beacon). On another device, open the game and type LOAD then paste this:", "good");
        this.say(code, "sys");
        if (this.io.copy && this.io.copy(code)) this.say("(Copied to your clipboard.)", "good");
        return;
      case "restart":
        if (!this.confirmRestart && !st.ended && p.raw !== "restart yes") {
          this.confirmRestart = true;
          return this.say("ARE YOU SURE? TYPE RESTART AGAIN TO START OVER.", "warn");
        }
        this.confirmRestart = false;
        return this.newGame();
      case "sound":
        if (S.Sound) { S.Sound.on = p.raw === "sound on" ? true : p.raw === "sound off" ? false : !S.Sound.on; }
        return this.say("SOUND " + (S.Sound && S.Sound.on ? "ON" : "OFF"), "sys");
      case "crt":
        if (this.io.crt) this.io.crt();
        return this.say("CRT SCANLINES TOGGLED.", "sys");
      case "packs":
        this.say("INSTALLED LANDS:", "sys");
        this.mainPacks().forEach(function (pk) { self.say(" " + (pk.order || "?") + ". " + up(pk.title) + (pk._source !== "builtin" ? " (COMMUNITY)" : ""), "sys"); });
        this.sidePacks().forEach(function (pk) { self.say(" SIDE: " + up(pk.title) + " (IN " + up(pk.hook ? pk.hook.pack : "?") + ")", "sys"); });
        if (this.io.mods) this.io.mods();
        return;
    }
  };

  // For testing a pasted pack straight away
  E.play = function (pid) {
    var p = S.packs[pid];
    if (!p) return;
    if (!this.state) this.newGame();
    if (p.type === "side") return this.enterSide(pid);
    this.enterPack(pid);
    this.status();
  };
})(typeof window !== "undefined" ? window : globalThis);

er a rocky ledge in a curtain of silver spray. Rainbows shimmer in the mist. Behind the falling water you can just make out a dark opening - you could step FORWARD through the falls. The bridge is BACK.","exits":{"back":"stream","left":"stream","forward":"cave"},"items":["falls"],"listen":"A roaring rush of water. Under it, very faintly... is that singing?","hint":"Step FORWARD through the falls. You might get wet.","pic":[["grad",6,4,0,30],["stars",1,3,8,0,0,160,20],["poly",12,0,10,58,12,62,74,0,80],["poly",12,159,8,102,12,98,74,159,80],["dither",11,0,10,60,70],["dither",11,100,10,60,70],["line",15,58,12,62,74],["line",15,102,12,98,74],["oval",0,80,46,12,16],["rect",14,60,8,40,66],["dither",1,60,8,40,66],["dither",6,62,30,36,30],["line",3,66,8,66,72],["line",1,74,8,74,74],["line",3,86,8,86,72],["line",1,94,8,94,74],["oval",6,80,84,70,12],["dither",14,10,76,140,16],["dither",15,40,70,80,8],["plot",2,44,64,46,62,7,48,60,5,50,58,6,52,56]]},"cave":{"name":"Cave Behind the Falls","desc":"A damp little cave, lit by thousands of tiny GLOW-WORMS on the ceiling. The roar of the waterfall is muffled here. Something shiny sits in a niche in the rock. The only way out is BACK through the falls.","exits":{"back":"waterfall"},"items":["glowworms","coin"],"listen":"Drip... drip... and the glow-worms, very quietly, singing in harmony.","hint":"Take what's in the niche. Caves are good for echoes, too...","pic":[["bg",0],["stars",13,7,60,10,0,140,30],["stars",3,8,40,20,0,120,24],["stars",1,9,12,30,0,100,20],["poly",11,0,0,30,20,24,70,0,99],["poly",11,159,0,130,24,136,70,159,99],["dither",12,0,0,26,99],["dither",12,134,0,26,99],["rect",14,0,30,8,50],["dither",1,0,30,8,50],["rect",9,0,82,160,18],["dither",11,0,82,160,18],["plot",14,40,88,90,92,120,86],["oval",11,112,52,10,7],["oval",0,112,53,7,4]]},"graveyard":{"name":"Forgotten Graveyard","desc":"Crooked GRAVESTONES lean in the long grass around a tiny ruined chapel. Cold mist hugs the ground. One gravestone looks newer than the rest 5,0,0,160,56],["plot",7,100,12],["plot",1,101,12],["rect",4,0,58,160,42],["dither",11,0,58,160,42],["oval",5,30,72,22,5],["dither",9,10,68,40,8],["poly",0,0,60,20,58,40,62,40,66,0,66],["line",14,46,62,70,66,100,64,130,70,159,68],["oval",15,140,62,5,3],["plot",7,120,61],["oval",15,80,118,96,34],["dither",12,0,90,160,10],["line",12,0,84,159,84],["line",12,0,90,159,90],["line",11,0,85,159,85],["line",12,20,84,20,96],["line",12,60,84,60,96],["line",12,100,84,100,96],["line",12,140,84,140,96]]}},"items":{"panel":{"name":"control panel","words":["panel","control panel","controls","label"],"scenery":true,"desc":"Behind the cracked cover: a RED wire and a BLUE wire. A scorched label reads: 'HATCH LOCK = RED'."},"wires":{"name":"wires","words":["wire","wires","cables","cable"],"scenery":true,"hidden":true,"desc":"A RED wire and a BLUE wire."},"redwire":{"name":"red wire","words":["red wire","red"],"scenery":true,"hidden":true,"desc":"A red wire, running to the hatch lock."},"bluewire":{"name":"blue wire","words":["blue wire","blue"],"scenery":true,"hidden":true,"desc":"A thick blue wire, humming faintly. It carries serious power."},"hatch":{"name":"hatch","words":["hatch","door"],"scenery":true,"desc":[{"if":"flag:hatch_open","text":"The hatch hangs open."},{"text":"A heavy round hatch, locked tight."}]},"stone":{"name":"smooth stone","words":["stone","rock","pebble","smooth stone"],"desc":"A smooth, fist-sized stone. Nice and heavy. Good for throwing.","pic":[["oval",15,58,92,3,2],["plot",1,57,91]]},"podshell":{"name":"escape pod","words":["pod","escape pod","capsule"],"scenery":true,"desc":"Your escape pod, half-buried and smoking. It will never fly again."},"signpost":{"name":"signpost","words":["signpost","sign","post","arrows"],"scenery":true,"desc":"A crooked wooden signpost with three arrows.","read":"LEFT: BOG & HERMIT   RIGHT: SCARECROW FIELD   FORWARD: RIVER & OBSERVATORY"},"beaconstone":{"name":"beacon","words":["beacon","beacon stone","green stone","glow"],"scenery":true,"desc":"Ancient tech, humming softly. It seems to remember you. (Beacons save your progress. If you die, you return to the last one.)"},"swamp":{"name":"bog","words":["bog","swamp","marsh","mud","surface"],"scenery":true,"desc":"Green, bubbling and deeply untrustworthy. There must be solid ground in there somewhere."},"hermit":{"name":"hermit","words":["hermit","man","old man","beard"],"npc":true,"scenery":true,"desc":"Skin and bones and beard. Mostly beard. His stomach rumbles like distant thunder.","talk":[{"if":"flag:hermit_fed","text":"\"The scarecrow knows where the treasure sleeps. And the beast by the stones? Soft as butter if you've got a bone for it.\""},{"text":"\"Fooood... forty moons I've eaten nothing but moss. Got any grub, stranger?\""}],"refuse":"The hermit sniffs it. \"Can't eat THAT!\"","pic":[{"if":"!flag:hermit_fed","ops":[["sprite",70,44,2,"...9999...","..999999..","..9aaaa9..","..a0aa0a..","..aaaaaa..","..f1111f..",".9f1111f9.","99f1111f99","9a9f11f9a9","999f11f999","9999ff9999","9999ff9999","99999f9999","9999999999","9999999999",".99999999.",".99999999.",".88....88."]]},{"if":"flag:hermit_fed","ops":[["sprite",100,46,2,"...9999...","..999999..","..9aaaa9..","..a0aa0a..","..aaaaaa..","..f1111f..",".9f1111f9.","99f1111f99","9a9f11f9a9","999f11f999","9999ff9999","9999ff9999","99999f9999","9999999999","9999999999",".99999999.",".99999999.",".88....88."]]}],"alien":true},"rope":{"name":"coil of rope","words":["rope","coil","coil of rope"],"desc":"Strong, hairy rope. About twenty metres of it.","pic":[["ring",7,40,88,8,4],["ring",7,40,88,5,2],["plot",7,48,86,50,84]]},"bone":{"name":"big bone","words":["bone","big bone"],"desc":"A huge knobbly bone. Some creature would absolutely love this.","pic":[["rect",1,72,88,14,2],["oval",1,71,88,2,2],["oval",1,86,89,2,2]]},"spade":{"name":"spade","words":["spade","shovel"],"desc":"The hermit's old spade. The blade is still sharp."},"pot":{"name":"pot","words":["pot","stew","stove","soup"],"scenery":true,"desc":"A pot of grey bubbling moss stew. It's looking back at you."},"scarecrow":{"name":"scarecrow","words":["scarecrow","pocket","coat"],"scenery":true,"desc":"A three-armed scarecrow in a tattered red coat. Its pumpkin-ish head grins at nothing."},"map":{"name":"torn map","words":["map","torn map","paper","scrap"],"desc":"A torn scrap of map. Try READing it.","pic":[["rect",1,63,52,4,5]]},"oaktree":{"name":"dead oak","words":["oak","tree","roots","root","dead oak"],"scenery":true,"desc":"Long dead, but still standing. Its roots grip the hill like fingers."},"coil":{"name":"flux coil","words":["coil","flux coil","flux"],"part":true,"desc":"A glowing coil of alien metal. One of the STARLING's missing parts!"},"bridge":{"name":"footbridge","words":["bridge","footbridge","planks"],"scenery":true,"desc":[{"if":"flag:fire_out","text":"Charred, but it'll hold."},{"text":"It's on fire. Very much on fire."}]},"fire":{"name":"fire","words":["fire","flames","flame","blaze"],"scenery":true,"desc":[{"if":"flag:fire_out","text":"Just wisps of steam now."},{"text":"Eerie green flames. They hiss when spray from the stream hits them."}]},"water":{"name":"stream","words":["stream","water","river"],"scenery":true,"desc":"Cold, clear, silvery water."},"wellshaft":{"name":"well","words":["well","shaft","winch"],"scenery":true,"desc":"An old stone well with a rusty winch. You drop a pebble in... and never hear it land."},"tiedrope":{"name":"rope","words":["rope"],"scenery":true,"hidden":true,"desc":"Your rope, tied firmly to the winch."},"note":{"name":"damp note","words":["note","damp note","paper"],"desc":"A soggy scrap of paper with writing on it.","read":"The ink has run, but you can make out: 'OBSERVATORY DOOR CODE: 7 3 0 4. Don't tell the hermit.'","pic":[["rect",1,40,88,7,4],["line",12,41,89,45,89]]},"navchip":{"name":"nav chip","words":["chip","nav chip","nav","navchip","glint"],"part":true,"desc":"A navigation chip, still blinking. One of the STARLING's missing parts!","pic":[["rect",3,120,46,4,3],["plot",1,121,47]]},"keypad":{"name":"keypad","words":["keypad","pad","keys","buttons","digits"],"scenery":true,"desc":"Ten worn buttons and a tiny screen: _ _ _ _. TYPE a 4-digit code, e.g. TYPE 1234."},"obsdoor":{"name":"door","words":["door","steel door"],"scenery":true,"desc":[{"if":"flag:obs_open","text":"It's open."},{"text":"Thick steel. Your knife won't help here."}]},"telescope":{"name":"telescope","words":["telescope","scope","eyepiece","lens"],"scenery":true,"desc":"A great brass telescope on a tripod. You could LOOK THROUGH it."},"bench":{"name":"workbench","words":["bench","workbench","tools"],"scenery":true,"desc":"Rusty spanners, bent nails, a mouldy sandwich..."},"hound":{"name":"Glimmerhound","words":["hound","glimmerhound","beast","dog","wolf","creature"],"npc":true,"scenery":true,"desc":"Glowing blue fur, glowing red eyes, and teeth like a drawer full of knives. It's watching your pockets.","talk":"\"Grrrrrrr.\" It is not a conversationalist.","refuse":"The Glimmerhound sniffs it, then goes back to growling at you.","pic":[["dither",3,52,60,56,30],["sprite",56,64,2,"................e...e.","...............eee.ee.","e..............eeeeee.",".e.............ee2eee3","..e...........eeeeeeee","..eeeeeeeeeeeeee1e1e1.",".eeeeeeeeeeeeeeeeeee..",".e3e3e3e3e3e3eeeee....","..eeeeeeeeeeeeeee.....","..ee.ee......ee.ee....","..ee.ee......ee.ee....",".33..33.....33..33...."]],"scan":"Lifeform: GLIMMERHOUND. Temperament: hungry. Favourite food: bones."},"altar":{"name":"altar","words":["altar","altar stone","slab"],"scenery":true,"desc":"A flat slab carved with spirals."},"tin":{"name":"rusty tin","words":["tin","rusty tin","box","can"],"desc":"A rusty tin, rusted shut. You could try to OPEN it.","pic":[["rect",8,110,69,7,3],["plot",2,112,69]],"scan":"Two objects inside: a metal bag and a glass cylinder."},"rivets":{"name":"hull rivets","words":["rivets","hull rivets","bag","rivet"],"part":true,"desc":"A bag of shiny hull rivets. One of the STARLING's missing parts!"},"fuse":{"name":"glass fuse","words":["fuse","glass fuse"],"desc":"A glass fuse. The filament inside glows faintly."},"machine":{"name":"portal machine","words":["machine","arch","portal","vortex","portal machine"],"scenery":true,"desc":[{"if":"flag:machine_on","text":"A vortex of stars swirls inside the arch, spiralling UP."},{"text":"A towering arch of alien metal. Cold and dead."}]},"mpanel":{"name":"access panel","words":["panel","access panel","screws","screw","socket"],"scenery":true,"desc":[{"if":"flag:panel_open","text":"An empty FUSE socket. A sticker says: 'INSERT FUSE. STAND CLEAR.'"},{"text":"A small panel held shut by four tiny screws."}]},"locker":{"name":"locker","words":["locker","cabinet","cupboard","toolkit"],"scenery":true,"desc":[{"if":"flag:locker_open","text":"An emergency locker, now open."},{"text":"A dented emergency locker on the wall. It's shut. You could OPEN it."}]},"zib":{"name":"Zib","words":["zib","alien","scout","creature","figure"],"npc":true,"scenery":true,"alien":true,"desc":[{"if":"flag:zib_healed","text":"A small green alien scout with two wobbly antennae. Much perkier now."},{"text":"A small green alien slumped against a rock, clutching a nasty wound. It needs medical help, fast."}],"talk":[{"if":"flag:zib_healed","text":"\"I'm Zib, scout of the Glimmer Reaches. I saw your ship break up - its parts rained across every world on the Starways! Three fell here on Grimmoor. Tip: the green BEACONS are ancient tech. If you die, they pull you back. And never walk into the bog blind - throw something first!\""},{"text":"\"Ugh... hurt... so hurt... if only... someone had... medicine...\""}],"refuse":"\"Thanks, but I don't need that.\"","pic":[{"if":"!flag:zib_healed","ops":[["sprite",8,58,2,"..7......7..","...7....7...","...dddddd...","..dddddddd..","..d01dd01d..","..d00dd00d..","..dddddddd..","...d5555d...","..55555555..",".5d555555d5.",".5d552255d5.","..55522555..","..55...55...",".555...555.."]]},{"if":"flag:zib_healed","ops":[["sprite",8,56,2,"..7......7..","...7....7...","...dddddd...","..dddddddd..","..d01dd01d..","..d00dd00d..","..dddd0ddd..","...d5555d...","d.55555555.d","d5d555555d5d","..d555555d..","..55555555..","..55...55...",".555...555.."]]}]},"mags":{"name":"Mags","words":["mags","crow","bird","raven"],"npc":true,"scenery":true,"alien":true,"desc":"A scruffy three-eyed crow perched on the scarecrow's arm. All three eyes are watching you.","talk":"\"CAW! Name's Mags. Three paces from the roots, three paces! The old oak keeps a secret, caw! And the hermit's got a spade he never uses. Feed him and he'll part with it!\"","refuse":"Mags pecks it, then loses interest.","pic":[["sprite",41,35,"...000...","..02220..","..0000077","..000000.",".00000000","000000...","...7..7.."]]},"burble":{"name":"Burble","words":["burble","frog","toad","creature"],"npc":true,"scenery":true,"alien":true,"desc":"A plump frog-like creature the size of a cat, sitting on a rock in the stream. It blinks at you slowly.","talk":[{"if":"flag:fire_out","text":"\"Blub! Well done, fire-drowner! Across the bridge there's a deep old well. Bring a rope - and keep your starshard lit down there, it's black as a boot.\""},{"text":"\"Blub! That fire's been burning for days. Fire hates water, and water loves a flask, blub! The stream's right here, isn't it?\""}],"refuse":"\"Blub. Can't eat that.\"","pic":[["oval",12,26,76,14,3],["oval",15,24,75,9,1],["sprite",14,58,2,".77......77.","7707....7707",".77dddddd77.",".dddddddddd.","dd00000000dd","dddddddddddd",".d555555555.","d55.5555.55d","dd..dddd..dd"]]},"k7":{"name":"K-7","words":["k7","k 7","robot","droid","android","machine"],"npc":true,"scenery":true,"alien":true,"desc":[{"if":"flag:k7_fixed","text":"K-7, the observatory's helper robot. Its visor glows a friendly green."},{"text":"A small helper robot slumped by the bench, sparking from a loose panel in its neck. Its visor flickers red. It needs FIXING."}],"talk":[{"if":"flag:k7_fixed","text":"\"SYSTEMS RESTORED. THANK YOU. I am K-7. The portal machine in the stone ring needs a replacement FUSE - my master hid one in a tin under the altar. The guardian beast there is dangerous... but statistically it cannot resist a BONE. Use the telescope to find the way.\""},{"text":"\"BZZT... ERR-OR... REPAIR... REQUIRED... BZZT.\""}],"refuse":"\"THAT ITEM IS NOT REQUIRED. BZZT.\"","pic":[["sprite",20,48,2,".....7....",".....b....","..ffffff..","..fbbbbf..","..fb22bf..","..fbbbbf..","..ffffff..","....bb....",".cccccccc.","cfcc77cccb","cfcc22cccb","cfcccccccb",".cccccccc.","..bb..bb..","..cc..cc..","..cc..cc..",".fff..fff."],{"if":"!flag:k7_fixed","ops":[["plot",7,19,58,42,54,1,40,50,18,62]]},{"if":"flag:k7_fixed","ops":[["rect",13,28,56,4,2]]}]},"warnsign":{"name":"sign","words":["sign","notice","board"],"scenery":true,"desc":"A rotting wooden sign with painted letters.","read":"TURN BACK. NOBODY WHO GOES IN COMES OUT THE SAME. - THE MANAGEMENT"},"carving":{"name":"carving","words":["carving","carved","letters","bark","tree","ancient tree","heart"],"scenery":true,"desc":"Letters carved deep into the bark. Try READing them."},"fungus":{"name":"fungus","words":["fungus","fungi","glow"],"scenery":true,"desc":"Pale fungus that glows a sickly green. Best not to lick it."},"webs":{"name":"webs","words":["webs","web","cobwebs"],"scenery":true,"desc":"Webs as thick as ropes. Whatever spun them is enormous."},"lantern":{"name":"old lantern","words":["lantern","old lantern","lamp"],"points":5,"desc":"An old brass lantern, cold and empty. Not much use on Grimmoor, but it might come in handy somewhere else on the Starways.","pic":[["rect",8,74,84,7,9],["rect",7,75,86,5,5],["line",12,74,83,80,83],["ring",12,77,81,2,2]]},"gnome":{"name":"gnome","words":["gnome","statue","garden gnome"],"npc":true,"scenery":true,"desc":"A stone garden gnome with a red hat and a suspiciously knowing smile.","talk":"The gnome's stone mouth creaks open: \"Hello, sailor!\" Then it freezes again, as if nothing happened.","refuse":"The gnome stares through you.","pic":[["sprite",104,52,2,"...2...","..222..",".22222.","2222222",".aaaaa.",".a0a0a.",".11111.","6111116","6611166",".66666.",".66.66.",".99.99."]]},"veg":{"name":"vegetables","words":["cabbages","cabbage","turnips","turnip","plants","vegetables","veg","rows"],"scenery":true,"desc":"Purple cabbages and fat white turnips. The turnips are humming."},"mushroom":{"name":"glowing mushroom","words":["mushroom","mushrooms","glowing mushroom","toadstool"],"points":5,"desc":"A mushroom that glows soft blue. The hermit won't miss one. Probably. It might light the way somewhere darker than Grimmoor.","pic":[["oval",3,140,85,4,2],["rect",15,139,86,2,4],["plot",1,139,84]]},"pattern":{"name":"crop circle","words":["circle","circles","pattern","spirals","wheat","centre","center","middle","metal","lump"],"scenery":true,"desc":"Perfect circles inside circles. No human made this. The lump of metal in the centre is warm to the touch."},"magnet":{"name":"horseshoe magnet","words":["magnet","horseshoe","horseshoe magnet"],"points":5,"desc":"A heavy red horseshoe magnet, super strong. It pulled itself free of the alien metal with a CLANG. Could be useful on another world.","pic":[["line",2,76,66,76,71,80,73,84,71,84,66],["line",2,77,66,77,71,80,72,83,71,83,66],["plot",15,76,66,77,66,83,66,84,66]]},"falls":{"name":"waterfall","words":["waterfall","falls","water","spray","curtain","opening"],"scenery":true,"desc":"A shimmering curtain of falling water. There's definitely an opening behind it."},"glowworms":{"name":"glow-worms","words":["worms","glow worms","glowworms","glow","ceiling"],"scenery":true,"desc":"Thousands of tiny glowing worms, twinkling like a private night sky."},"coin":{"name":"silver coin","words":["coin","silver coin","silver","niche"],"points":5,"desc":"A heavy silver coin stamped with a three-eyed crow. Someone, somewhere on the Starways, will want this.","pic":[["oval",7,112,53,2,2],["plot",1,111,52]]},"graves":{"name":"gravestones","words":["gravestone","gravestones","stone","stones","grave","graves","newest","newer","headstone","tombstone"],"scenery":true,"desc":"Crooked old gravestones. One is newer than the rest. You could READ it."},"crypt":{"name":"crypt","words":["crypt","gate","gates","chains","chain","padlock","lock"],"scenery":true,"desc":"Iron gates, chained and padlocked. The lock is an odd alien design - nothing like a normal key."},"key":{"name":"brass key","words":["key","brass key"],"points":5,"desc":"A small brass key with a star-shaped head. It doesn't fit anything on Grimmoor... yet.","pic":[["line",7,96,90,104,90],["oval",7,94,90,2,2],["plot",7,102,91,104,91]]},"sky":{"name":"sky","words":["sky","stars","space","glint","heavens","night sky","up"],"scenery":true,"desc":"An ocean of stars. Something tiny glints, moving slowly against them."},"railing":{"name":"railing","words":["railing","rail","balcony","edge"],"scenery":true,"desc":"A rusty iron railing. It wobbles worryingly."},"starchart":{"name":"star chart","words":["chart","star chart","map of stars"],"points":5,"desc":"A crumpled chart of the Starways: seven worlds joined by faint dotted lines, and an eighth circled in red. Most of it is torn away.","read":"Seven worlds in a chain: GRIMMOOR at one end. Beyond the seventh, a red circle and a scribble: 'STARLING WRECK?'","pic":[["rect",1,108,82,9,6],["line",6,109,83,115,86],["plot",2,114,84]]},"tanks":{"name":"oxygen tanks","words":["tanks","tank","oxygen","oxygen tanks","cylinders","o2"],"scenery":true,"fixed":"They're bolted to the wall and weigh a ton. Grimmoor's air is breathable anyway - just a bit whiffy.","desc":"Two big oxygen tanks, bolted firmly to the wall. The gauges read FULL. Shame they won't come with you.","scan":"Oxygen: 98%. Mounting bolts: welded. Not removable."},"radio":{"name":"radio","words":["radio","transmitter","comms","receiver"],"scenery":true,"fixed":"It's wired into the pod's hull.","desc":"A battered emergency radio with a cracked dial. You could try to USE it."},"lifejacket":{"name":[{"if":"flag:jacket_on","text":"life jacket (wearing)"},{"text":"life jacket"}],"words":["jacket","life jacket","lifejacket","vest","life vest"],"points":5,"wearable":true,"desc":"A bright orange inflatable life jacket, STARLING-issue. No water deep enough to need it on Grimmoor... but other worlds might be wetter.","pic":[["line",15,46,38,46,43],["poly",10,38,44,44,43,46,48,48,43,54,44,55,66,37,66],["line",11,44,43,46,50,48,43],["line",2,46,50,46,66],["rect",7,38,52,17,2],["rect",7,38,60,17,2],["line",15,37,66,55,66]]},"flightlog":{"name":"flight log","words":["log","flight log","logbook","tablet","book"],"points":0,"desc":"A cracked data tablet: the STARLING's flight log. READ it.","read":"STARLING FLIGHT LOG.  DAY 211: Wormhole storm dead ahead. Captain says 'it'll be fine.'  DAY 211 (LATER): It was not fine. Hull breach. Parts shearing off everywhere. Launching escape pod. If anyone finds this - the ship's parts are scattered across the STARWAYS. Collect all 21.","pic":[["rect",11,60,92,8,4],["rect",3,61,93,6,2]]},"firstaid":{"name":"first aid kit","words":["first aid kit","kit","first aid","aid kit","aid","plasters","plaster","bandage","bandaid","dressing","medkit"],"hidden":true,"desc":"A compact STARLING first aid kit: a roll of plasters, a bandage and an antiseptic wipe. Whoever packed it expected trouble.","pic":[["sprite",40,68,2,"..222222..","..221122..","2111111112","2111111112","..221122..","..222222.."]]},"wife":{"name":[{"if":"flag:wife_bandaged","text":"hermit's wife (plastered thumb)"},{"if":"flag:wife_cut","text":"hermit's wife (cut finger)"},{"text":"hermit's wife"}],"words":["wife","woman","lady","her"],"npc":true,"scenery":true,"refuse":"\"That's kind of you, love, but keep your treasures. It's a PLASTER I'm after.\"","desc":[{"if":"flag:wife_bandaged","text":"Rosy-cheeked and triumphant, thumb neatly plastered, she presides over a plate of cheese and pickle sandwiches."},{"if":"flag:wife_cut","text":"She winces, cradling her cut thumb. A plate of bread, cheese and pickle waits beside the knife."},{"text":"A rosy-cheeked woman in a floury apron, slicing bread into neat sandwiches at the table and humming as she works."}],"talk":[{"if":"flag:wife_bandaged","text":"\"Best sandwich I've made all year, if I do say so myself,\" she says. \"Cheese and pickle. A classic for a reason.\""},{"if":"flag:wife_cut","text":"\"Ow... ow...\" She holds up her thumb. \"Twenty years of cooking and never once a slip till today. You haven't got a plaster, have you? GIVE it here, or USE that kit of yours.\""},{"text":"\"Evening, stranger!\" she calls, waving her bread knife. \"Sandwiches soon. My man's finally eating proper food!\""}],"pic":[["sprite",34,48,2,"...9999...","..999999..","..9aaaa9..","..a0aa0a..","..aaaaaa..","..999999..",".9f1111f9.","99f1111f99","9a9f11f9a9","9999119999","9999119999","9999ff9999",".99999999.",".88....88."]]}},"actions":[{"verb":["examine","peer","open"],"noun":"lifejacket","room":"pod","if":"!flag:kit_found","do":[{"set":"kit_found"},{"show":"firstaid"},{"say":"You turn the LIFE JACKET over. No water deep enough to need it on Grimmoor... but sewn inside the collar is a sealed plastic pocket, and inside THAT: a FIRST AID KIT. Whoever packed for this trip expected trouble."},{"score":5},{"sound":"beep"}]},{"verb":["examine","peer","open"],"noun":"lifejacket","room":"pod","if":"flag:kit_found","do":[{"say":"The life jacket's secret pocket is empty now. Just orange rubber and the faint smell of plasters."}]},{"verb":"talk","noun":"wife","room":"hutin","if":"!flag:wife_cut","do":[{"set":"wife_cut"},{"say":"\"Evening, stranger!\" The hermit's wife beams, waving her bread knife grandly. \"Forty moons I've waited to cook my man a proper tea, and today he finally brought home food. So it's SANDWICHES all round!\" She jabs the knife at the bread for emphasis... and winces. \"OW! Oh, sugar. I've gone and sliced my finger.\""},{"sound":"bad"}]},{"verb":["give","use"],"noun":"firstaid","room":"hutin","if":["flag:wife_cut","near:firstaid","!flag:wife_bandaged"],"do":[{"set":"wife_bandaged"},{"say":"You peel a PLASTER off the roll and smooth it over her cut. She flexes her thumb, delighted. \"Good as new! And look at you, prepared as a field medic. Right - you've earned this.\" She stacks cheese and pickle into a doorstop-thick sandwich and pushes it across the table. You eat it there and then. It is, without question, the finest sandwich on Grimmoor."},{"score":10},{"secret":"sandwiches"},{"sound":"good"}]},{"verb":["give","use"],"noun":"firstaid","room":"hutin","if":"flag:wife_bandaged","do":[{"say":"\"Sweet of you, but the one plaster did the trick,\" she says, wiggling her thumb. \"Sit down instead - there's plenty more sandwich where that came from.\""}]},{"verb":["give","use"],"noun":"firstaid","room":"hutin","if":"!flag:wife_cut","do":[{"say":"She peers up from her slicing. \"Bless you, love, but all my fingers are still attached. Give it a minute - this bread fights back.\""}]},{"verb":"heal","noun":"wife","room":"hutin","if":"flag:wife_cut","do":[{"say":"\"It's only a scratch, love,\" she says, wobbling her thumb at you. \"What it needs is a proper PLASTER.\""}]},{"verb":["use","listen","push","fix"],"noun":"radio","do":[{"say":"You twiddle the dial. Static... hiss... then, very faintly: \"...STARLING... do you read... your parts are... scattered across... seven...\" KRRRK. Silence."},{"sound":"beep"}]},{"verb":["take","pull","use","open"],"noun":"tanks","do":[{"say":"You heave at the oxygen tanks. They don't budge - bolted and welded to the wall. Grimmoor's air is breathable anyway, just a bit whiffy."}]},{"verb":"wear","noun":"lifejacket","if":["has:lifejacket","!flag:jacket_on"],"do":[{"set":"jacket_on"},{"say":"You pull on the life jacket and clip it shut. You look ridiculous, but you won't drown. Probably."}]},{"verb":"wear","noun":"lifejacket","if":"flag:jacket_on","do":[{"say":"You're already wearing it."}]},{"verb":"wear","noun":"lifejacket","do":[{"say":"Pick it up first."}]},{"verb":["deactivate","drop"],"noun":"lifejacket","if":"flag:jacket_on","do":[{"clear":"jacket_on"},{"say":"You unclip the life jacket and carry it instead."}]},{"verb":["pull","use"],"noun":"lifejacket","if":"has:lifejacket","do":[{"say":"You yank the toggle. PFFFT! The jacket inflates... then slowly deflates again with a sad noise. Best save that for when you really need it."}]},{"verb":"jump","room":"waterfall","if":"flag:jacket_on","do":[{"say":"You leap into the pool below the falls and bob happily in your life jacket like a cork. Refreshing! You paddle back to the bank."}]},{"verb":["read","examine"],"noun":"carving","do":[{"say":"Carved deep into the bark, inside a lopsided heart: 'ZX + C64 4EVER'. Underneath, much smaller: 'LOAD \"\" ... press PLAY on tape.' Somebody else crash-landed here, a long time ago."},{"secret":"carving"}]},{"verb":["eat","touch"],"noun":"fungus","do":[{"say":"You lean in to sniff it. It sniffs you back. You leave it alone."}]},{"verb":["cut","touch","pull"],"noun":"webs","do":[{"say":"You touch a web. It TWANGS like a guitar string. Somewhere ahead, the clicking speeds up. Bad idea."}]},{"verb":"talk","noun":"gnome","do":[{"say":"The gnome's stone mouth creaks open: \"Hello, sailor!\" Then it freezes again, as if nothing happened."},{"secret":"gnome"}]},{"verb":["eat"],"noun":"mushroom","do":[{"say":"You decide that eating glowing things is how people end up with extra heads. Better keep it."}]},{"verb":["dance","wait","jump","shout"],"room":"cropcircle","do":[{"say":"You stand in the centre of the circle and..."},{"say":"VWOOOM! A beam of light blasts down from the sky! A cow drifts slowly past you, upwards, looking embarrassed. The beam winks out. Nobody will ever believe you."},{"secret":"cow"}]},{"verb":"shout","room":"cave","do":[{"say":"\"HELLO!\" ... hello ... hello ... \"WHY ARE YOU SHOUTING AT WORMS?\" ... worms ... worms ..."},{"secr set":"k7_heard"},{"say":"\"SYSTEMS RESTORED. THANK YOU. I am K-7. The portal machine in the stone ring needs a replacement FUSE - my master hid one in a tin under the altar. The guardian beast there is dangerous... but statistically it cannot resist a BONE. Use the telescope to find the way.\""},{"say":"(K-7 looks like it has more to say. Try talking again.)"}]},{"verb":"use","noun":"machine","room":"portal","if":"flag:machine_on","do":[{"say":"It's already humming with power. The vortex spirals UP."}]},{"verb":"use","noun":"machine","room":"portal","if":"!has:fuse","do":[{"say":"You hunt for a switch. Nothing. The machine is dead - something's missing from inside the access panel."}]},{"verb":"deactivate","noun":"machine","room":"portal","do":[{"say":"And strand yourself here forever? Better not."}]},{"verb":["use","deactivate"],"noun":"beaconstone","do":[{"say":"The beacon has no switch. It hums along on its own, remembering you."}]},{"verb":["open","examine"],"noun":"locker","if":"!flag:locker_open","do":[{"set":"locker_open"},{"show":"edriver"},{"say":"The locker door squeals open. Inside, clipped to the wall: an ELECTRONIC SCREWDRIVER - the STARLING's best tool. It fixes things, opens things, and can SCAN for secrets."},{"score":5}]},{"verb":["heal","use","give"],"noun":["zib","medpen"],"room":"crater","if":["!flag:zib_healed","has:medpen","!flag:core:pen_used>=3"],"do":[{"inc":"core:pen_used"},{"set":"zib_healed"},{"sound":"good"},{"say":"You press the medical pen to the alien's arm. HISS! The wound glows, seals, and vanishes. The little alien blinks, sits up and chirps something at you."},{"score":20}]},{"verb":["heal","use"],"noun":["zib","medpen"],"room":"crater","if":"flag:zib_healed","do":[{"say":"Zib is fine now. Save the doses."}]},{"verb":["fix","use","open"],"noun":["k7","edriver"],"room":"observatory","if":["!flag:k7_fixed","has:edriver"],"do":[{"set":"k7_fixed"},{"sound":"good"},{"say":"You open K-7's neck panel with the electronic screwdriver and r
